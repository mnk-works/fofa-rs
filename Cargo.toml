[package]
name = "fofa-rs"
version = "0.2.1"
edition = "2024"
authors = ["modemnakata <modemnakata@example.com>"]
description = "A fast, lightweight Rust CLI tool for parsing FOFA.io search results"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mnk-works/fofa-rs"
keywords = ["fofa", "security", "scanner", "cli", "api"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.0"
anyhow = "1.0"
base64 = "0.23"
tokio = { version = "1.40", features = ["full"] }
dirs = "5.0"